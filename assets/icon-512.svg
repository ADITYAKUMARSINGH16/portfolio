<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanViolet512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="neonGlow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad512)" stroke="#1e293b" stroke-width="4" />

  <!-- Hexagon Frame -->
  <polygon points="256,64 416,156 416,356 256,448 96,356 96,156" fill="none" stroke="url(#cyanViolet512)" stroke-width="8" filter="url(#neonGlow512)" />

  <!-- Outer Pulse Circle -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="2" stroke-dasharray="10 15" />

  <!-- Vertex Dots -->
  <circle cx="256" cy="64" r="10" fill="#38bdf8" />
  <circle cx="416" cy="156" r="10" fill="#818cf8" />
  <circle cx="416" cy="356" r="10" fill="#c084fc" />
  <circle cx="256" cy="448" r="10" fill="#38bdf8" />
  <circle cx="96" cy="356" r="10" fill="#818cf8" />
  <circle cx="96" cy="156" r="10" fill="#c084fc" />

  <!-- Monogram A -->
  <path d="M192 340 L256 170 L320 340 M214 290 L298 290" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow512)" />
  <circle cx="256" cy="256" r="8" fill="#38bdf8" />

  <!-- Tech Status Tag -->
  <text x="256" y="405" font-family="monospace" font-size="24" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="4">ADITYA // SYS</text>
</svg>
